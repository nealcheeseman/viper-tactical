<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Viper Tactical PWA</title><link rel="manifest" href="manifest.json"></head><body><h1>⛵ Viper Tactical PWA</h1><button onclick="demo()">Demo Mode</button><button onclick="gps()">Start GPS</button><div id="out">Ready</div><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("service-worker.js");} function demo(){out.innerHTML="Demo enabled";} function gps(){navigator.geolocation.getCurrentPosition(p=>out.innerHTML=`${p.coords.latitude}, ${p.coords.longitude}`,e=>out.innerHTML=e.message);}</script></body></html>
